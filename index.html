<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OKlch Color Palette Generator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Three.js for 3D Visualization -->
    <script src="https://unpkg.com/three@0.128.0/build/three.min.js"></script>
    <script src="https://unpkg.com/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <style>
        /* Custom styles for SVG UI */
        .point { cursor: grab; transition: r 0.1s; }
        .point:active { cursor: grabbing; }
        .point:hover { r: 8; stroke-width: 3; }
        .handle-line { stroke: #64748b; stroke-width: 1.5; stroke-dasharray: 4; }
        .curve-1 { stroke: #ffffff; fill: none; stroke-width: 3.5; stroke-linecap: round; }
        .curve-2 { stroke: #ffffff; fill: none; stroke-width: 3.5; stroke-linecap: round; }
        .ctrl-point { fill: #f8fafc; stroke: #0f172a; stroke-width: 2; r: 6; }
        .main-point { fill: #f8fafc; stroke: #0f172a; stroke-width: 2; r: 7; }
        .inner-point { fill: currentColor; pointer-events: none; }
        .editor-canvas-svg { cursor: grab; }
        .editor-canvas-svg.is-panning { cursor: grabbing; }
        
        /* Hide scrollbars but keep functionality */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #1e293b; }
        ::-webkit-scrollbar-thumb { background: #475569; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #64748b; }
        
        /* Custom Slider Style */
        input[type=range].color-slider {
            -webkit-appearance: none;
            appearance: none;
            height: 12px;
            border-radius: 6px;
            background: #334155;
            outline: none;
        }
        input[type=range].color-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: #ffffff;
            border: 2px solid #0f172a;
            cursor: pointer;
            box-shadow: 0 0 2px rgba(0,0,0,0.5);
        }
        input[type=range].color-slider::-moz-range-thumb {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: #ffffff;
            border: 2px solid #0f172a;
            cursor: pointer;
            box-shadow: 0 0 2px rgba(0,0,0,0.5);
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-200 min-h-screen w-full overflow-x-hidden overflow-y-auto sm:h-screen sm:h-[100dvh] sm:w-screen sm:overflow-hidden flex flex-col font-sans">

    <!-- Top Area: Controls and Editors -->
    <div class="flex flex-col sm:flex-1 sm:min-h-0 sm:flex-row sm:overflow-hidden">
        
        <!-- Sidebar Controls -->
        <aside class="w-full sm:w-80 bg-slate-900 border-b sm:border-b-0 sm:border-r border-slate-800 flex flex-col sm:overflow-y-auto z-10 shrink-0">
            <div class="p-4 sm:p-5 border-b border-slate-800">
                <div class="flex items-start justify-between gap-2">
                    <div>
                        <h1 class="text-xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-blue-400 to-purple-400">OKlch Palette Plugin</h1>
                        <p class="text-xs text-slate-400 mt-1">3D curve & multi-section visualizer</p>
                    </div>
                    <div class="flex items-center gap-1 shrink-0 pt-0.5">
                        <button id="undo-btn" disabled title="Undo last change (Ctrl+Z)" class="p-1.5 rounded-lg bg-slate-800 border border-slate-700 text-slate-300 hover:bg-slate-700 hover:text-white disabled:opacity-35 disabled:pointer-events-none transition-colors">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 10h10a5 5 0 015 5v2M3 10l4-4m-4 4l4 4"></path>
                            </svg>
                        </button>
                        <button id="redo-btn" disabled title="Redo last undone change (Ctrl+Y)" class="p-1.5 rounded-lg bg-slate-800 border border-slate-700 text-slate-300 hover:bg-slate-700 hover:text-white disabled:opacity-35 disabled:pointer-events-none transition-colors">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 10H11a5 5 0 00-5 5v2m15-7l-4-4m4 4l-4 4"></path>
                            </svg>
                        </button>
                    </div>
                </div>
            </div>

            <div class="p-4 sm:p-5 space-y-6 sm:space-y-8 flex-1">
                
                <!-- Number of Swatches -->
                <div>
                    <label class="flex justify-between text-sm font-semibold mb-2">
                        <span>Color Stops</span>
                    </label>
                    <div class="flex items-center gap-3">
                        <input type="range" id="steps" min="3" max="256" step="1" value="9" class="flex-1 color-slider" style="background: #475569;">
                        <input type="number" id="steps-num" min="3" max="256" value="9" class="w-16 bg-slate-900 border border-slate-700 rounded text-center text-sm focus:outline-none focus:border-blue-500 text-white font-mono py-1">
                    </div>
                </div>

                <!-- Colors Loop rendered via JS logic below -->
                <div id="color-inputs-container" class="space-y-6">
                    <!-- Dynamic content injected here to keep HTML DRY -->
                </div>
            </div>
        </aside>

        <!-- Main Visualization Area -->
        <main class="flex flex-col sm:flex-1 bg-slate-950 relative sm:overflow-hidden">
            
            <div class="grid grid-cols-1 sm:flex-1 xl:grid-cols-3 gap-4 sm:gap-6 p-4 sm:p-6 sm:overflow-y-auto">
                
                <!-- L vs C Editor -->
                <div class="flex flex-col items-center bg-slate-900/50 p-4 rounded-xl border border-slate-800">
                    <h2 class="text-sm font-semibold text-slate-300 mb-4 tracking-wider uppercase">Lightness vs Chroma</h2>
                    <div class="relative w-full max-w-[300px] aspect-square rounded-lg shadow-inner border border-slate-700/50 overflow-hidden">
                        <canvas id="bg-lc" width="300" height="300" class="absolute inset-0 w-full h-full"></canvas>
                        <svg id="svg-lc" viewBox="0 0 300 300" class="editor-canvas-svg absolute inset-0 w-full h-full select-none touch-none bg-transparent">
                            <!-- Grid generated dynamically -->
                            <g id="lc-grid"></g>

                            <!-- Non-selected palette ghosts (non-interactive) -->
                            <g id="lc-ghosts" pointer-events="none"></g>
                            
                            <!-- Connecting handle lines -->
                            <line id="lc-h1-line" class="handle-line" />
                            <line id="lc-h2-line" class="handle-line" />
                            <line id="lc-h3-line" class="handle-line" />
                            <line id="lc-h4-line" class="handle-line" />
                            
                            <!-- Curves -->
                            <path id="lc-curve-1" class="curve-1" />
                            <path id="lc-curve-2" class="curve-2" />
                            
                            <!-- Draggable Nodes -->
                            <circle id="lc-h-d-out" class="ctrl-point point" />
                            <circle id="lc-h-m-in" class="ctrl-point point" />
                            <circle id="lc-h-m-out" class="ctrl-point point" />
                            <circle id="lc-h-l-in" class="ctrl-point point" />
                            
                            <circle id="lc-d" class="main-point point" />
                            <circle id="lc-d-inner" r="3.5" class="inner-point" />
                            <circle id="lc-m" class="main-point point" />
                            <circle id="lc-m-inner" r="3.5" class="inner-point" />
                            <circle id="lc-l" class="main-point point" />
                            <circle id="lc-l-inner" r="3.5" class="inner-point" />
                        </svg>
                    </div>
                    <div class="w-full max-w-[300px] flex justify-between text-[10px] text-slate-500 mt-2 px-1">
                        <span>0 Chroma</span>
                        <span>0.4 Chroma</span>
                    </div>
                    <div class="w-full max-w-[300px] grid grid-cols-2 gap-2 mt-3">
                        <button id="reflect-lc-l" class="py-1.5 px-2.5 bg-slate-800/90 hover:bg-slate-700 text-slate-300 hover:text-white text-[11px] font-medium rounded-lg border border-slate-700/80 transition-colors flex items-center justify-center gap-1.5" title="Reflect Lightness of all stops and handles around 0.5">
                            <svg class="w-3.5 h-3.5 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16V4m0 0L3 8m4-4l4 4m6 0v12m0 0l4-4m-4 4l-4-4"></path>
                            </svg>
                            <span>Invert L (0.5)</span>
                        </button>
                        <button id="reflect-lc-c" class="py-1.5 px-2.5 bg-slate-800/90 hover:bg-slate-700 text-slate-300 hover:text-white text-[11px] font-medium rounded-lg border border-slate-700/80 transition-colors flex items-center justify-center gap-1.5" title="Reflect Chroma of all stops and handles around 0.2">
                            <svg class="w-3.5 h-3.5 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7h12m0 0l-4-4m4 4l-4 4m0 6H4m0 0l4 4m-4-4l4-4"></path>
                            </svg>
                            <span>Invert C (0.2)</span>
                        </button>
                    </div>
                </div>

                <!-- H vs C Editor -->
                <div class="flex flex-col items-center bg-slate-900/50 p-4 rounded-xl border border-slate-800">
                    <h2 class="text-sm font-semibold text-slate-300 mb-4 tracking-wider uppercase">Hue vs Chroma (Polar)</h2>
                    <div class="relative w-full max-w-[300px] aspect-square rounded-full shadow-inner border border-slate-700/50 overflow-hidden">
                        <canvas id="bg-hc" width="300" height="300" class="absolute inset-0 w-full h-full"></canvas>
                        <svg id="svg-hc" viewBox="0 0 300 300" class="editor-canvas-svg absolute inset-0 w-full h-full select-none touch-none bg-transparent overflow-visible">
                            <!-- Grid generated dynamically -->
                            <g id="hc-grid"></g>

                            <!-- Non-selected palette ghosts (non-interactive) -->
                            <g id="hc-ghosts" pointer-events="none"></g>
                            
                            <!-- Connecting handle lines -->
                            <line id="hc-h1-line" class="handle-line" />
                            <line id="hc-h2-line" class="handle-line" />
                            <line id="hc-h3-line" class="handle-line" />
                            <line id="hc-h4-line" class="handle-line" />
                            
                            <!-- Curves -->
                            <path id="hc-curve-1" class="curve-1" />
                            <path id="hc-curve-2" class="curve-2" />
                            
                            <!-- Draggable Nodes -->
                            <circle id="hc-h-d-out" class="ctrl-point point" />
                            <circle id="hc-h-m-in" class="ctrl-point point" />
                            <circle id="hc-h-m-out" class="ctrl-point point" />
                            <circle id="hc-h-l-in" class="ctrl-point point" />

                            <circle id="hc-d" class="main-point point" />
                            <circle id="hc-d-inner" r="3.5" class="inner-point" />
                            <circle id="hc-m" class="main-point point" />
                            <circle id="hc-m-inner" r="3.5" class="inner-point" />
                            <circle id="hc-l" class="main-point point" />
                            <circle id="hc-l-inner" r="3.5" class="inner-point" />
                        </svg>
                    </div>
                    <div class="w-full max-w-[300px] text-center text-[10px] text-slate-500 mt-2">
                        Radial Distance = Chroma | Angle = Hue
                    </div>
                    <div class="w-full max-w-[300px] grid grid-cols-2 gap-2 mt-3">
                        <button id="reflect-hc-h" class="py-1.5 px-2.5 bg-slate-800/90 hover:bg-slate-700 text-slate-300 hover:text-white text-[11px] font-medium rounded-lg border border-slate-700/80 transition-colors flex items-center justify-center gap-1.5" title="Reflect Hue of all stops and handles around 0°">
                            <svg class="w-3.5 h-3.5 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path>
                            </svg>
                            <span>Invert H (0°)</span>
                        </button>
                        <button id="reflect-hc-c" class="py-1.5 px-2.5 bg-slate-800/90 hover:bg-slate-700 text-slate-300 hover:text-white text-[11px] font-medium rounded-lg border border-slate-700/80 transition-colors flex items-center justify-center gap-1.5" title="Reflect Chroma of all stops and handles around 0.2">
                            <svg class="w-3.5 h-3.5 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7h12m0 0l-4-4m4 4l-4 4m0 6H4m0 0l4 4m-4-4l4-4"></path>
                            </svg>
                            <span>Invert C (0.2)</span>
                        </button>
                    </div>
                </div>

                <!-- 3D Viewer -->
                <div class="flex flex-col bg-slate-900/50 p-4 rounded-xl border border-slate-800 xl:row-span-1 xl:col-span-1 h-[340px] sm:h-[400px] xl:h-auto">
                    <h2 class="text-sm font-semibold text-slate-300 mb-4 tracking-wider uppercase text-center">3D OKlch Space</h2>
                    <div id="3d-container" class="flex-1 w-full bg-slate-900 rounded-lg shadow-inner border border-slate-700/50 overflow-hidden relative cursor-move"></div>
                </div>

            </div>
        </main>
    </div>

    <!-- Bottom Area: Palette Output -->
    <footer class="bg-slate-900 border-t border-slate-800 px-4 py-4 sm:px-5 sm:py-3 sm:max-h-[46dvh] shrink-0 z-20 flex flex-col gap-2">
        <div id="palettes-list" class="space-y-2 sm:min-h-[4.5rem] sm:flex-1 sm:overflow-y-auto sm:pr-1">
            <!-- Palette rows will be generated here -->
        </div>
        <!-- First Button Row: Add palette -->
        <div class="flex items-center justify-center pt-1 shrink-0">
            <button id="add-palette-btn" class="py-2 px-4 bg-slate-800 hover:bg-slate-700 text-slate-200 hover:text-white text-xs font-semibold tracking-wider rounded-lg border border-slate-700 transition-colors flex items-center justify-center gap-1.5 shadow-sm">
                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path>
                </svg>
                <span>Add palette</span>
            </button>
        </div>
        <!-- Second Button Row: Export / Import -->
        <div class="flex flex-wrap items-stretch sm:items-center justify-center gap-2.5 shrink-0">
            <button id="export-clrs-btn" class="py-2 px-4 bg-slate-800 hover:bg-slate-700 text-slate-200 hover:text-white text-xs font-semibold tracking-wider rounded-lg border border-slate-700 transition-colors flex items-center justify-center gap-2 shadow-sm">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path>
                </svg>
                <span>Export Infinite Painter (.clrs)</span>
            </button>
            <button id="export-json-btn" class="py-2 px-4 bg-slate-800 hover:bg-slate-700 text-slate-200 hover:text-white text-xs font-semibold tracking-wider rounded-lg border border-slate-700 transition-colors flex items-center justify-center gap-2 shadow-sm">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path>
                </svg>
                <span>Export JSON</span>
            </button>
            <button id="import-json-btn" class="py-2 px-4 bg-slate-800 hover:bg-slate-700 text-slate-200 hover:text-white text-xs font-semibold tracking-wider rounded-lg border border-slate-700 transition-colors flex items-center justify-center gap-2 shadow-sm">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"></path>
                </svg>
                <span>Import JSON</span>
            </button>
            <input type="file" id="import-json-input" accept=".json,application/json" class="hidden">
        </div>
    </footer>

    <script>
        /**
         * OKlch Application State (Supports multiple independent palette rows)
         */
        function createDefaultPaletteConfig() {
            return {
                dark: { l: 0.2, c: 0.12, h: 260 },
                mid: { l: 0.6, c: 0.35, h: 320 },
                light: { l: 0.95, c: 0.08, h: 50 },
                handles: {
                    d_out: { l: 0.35, c: 0.2, h: 290 },
                    m_in:  { l: 0.45, c: 0.3, h: 300 },
                    m_out: { l: 0.75, c: 0.4, h: 340 },
                    l_in:  { l: 0.8,  c: 0.2, h: 10 }
                },
                locked: { dark: false, mid: false, light: false },
                steps: 9
            };
        }

        function clonePaletteConfig(cfg) {
            return {
                dark: { ...cfg.dark },
                mid: { ...cfg.mid },
                light: { ...cfg.light },
                handles: {
                    d_out: { ...cfg.handles.d_out },
                    m_in:  { ...cfg.handles.m_in },
                    m_out: { ...cfg.handles.m_out },
                    l_in:  { ...cfg.handles.l_in }
                },
                locked: { ...cfg.locked },
                steps: cfg.steps
            };
        }

        const appState = {
            palettes: [createDefaultPaletteConfig()],
            activeIndex: 0
        };

        // Active palette reference for sidebar, 2D SVG editors, and 3D viewer
        let state = appState.palettes[0];

        const keys = ['dark', 'mid', 'light'];
        const MAX_C = 0.4;
        let dragging = null;   // Reference to point being dragged
        let dragSpace = null;  // 'LC' or 'HC' context of the drag event
        let dragChanged = false;

        // Background drag state
        let bgDragging = false;
        let bgDragSpace = null;
        let bgStartLoc = null;
        let bgStartState = null;
        let bgPrevAngle = 0;
        let bgCumDH = 0;
        let lastBgMoveEvent = null;

        // Single-step Undo / Redo snapshots
        let undoSnapshot = null;
        let redoSnapshot = null;
        let pendingSnapshot = null;

        function cloneState() {
            return {
                palettes: appState.palettes.map(clonePaletteConfig),
                activeIndex: appState.activeIndex
            };
        }

        function paletteConfigsEqual(a, b) {
            if (!a || !b) return false;
            if (a.steps !== b.steps) return false;
            for (const k of keys) {
                if (a.locked[k] !== b.locked[k]) return false;
                if (Math.abs(a[k].l - b[k].l) > 1e-6 || Math.abs(a[k].c - b[k].c) > 1e-6 || Math.abs(a[k].h - b[k].h) > 1e-4) return false;
            }
            for (const hk of ['d_out', 'm_in', 'm_out', 'l_in']) {
                if (Math.abs(a.handles[hk].l - b.handles[hk].l) > 1e-6 || Math.abs(a.handles[hk].c - b.handles[hk].c) > 1e-6 || Math.abs(a.handles[hk].h - b.handles[hk].h) > 1e-4) return false;
            }
            return true;
        }

        function statesEqual(a, b) {
            if (!a || !b) return false;
            if (a.activeIndex !== b.activeIndex) return false;
            if (a.palettes.length !== b.palettes.length) return false;
            for (let i = 0; i < a.palettes.length; i++) {
                if (!paletteConfigsEqual(a.palettes[i], b.palettes[i])) return false;
            }
            return true;
        }

        function restoreState(snap) {
            if (!snap || !snap.palettes || snap.palettes.length === 0) return;
            appState.palettes = snap.palettes.map(clonePaletteConfig);
            appState.activeIndex = Math.max(0, Math.min(snap.activeIndex, appState.palettes.length - 1));
            state = appState.palettes[appState.activeIndex];
            updateAll();
        }

        function updateUndoRedoButtons() {
            const undoBtn = document.getElementById('undo-btn');
            const redoBtn = document.getElementById('redo-btn');
            if (undoBtn) undoBtn.disabled = !undoSnapshot;
            if (redoBtn) redoBtn.disabled = !redoSnapshot;
        }

        // Capture state right before a continuous gesture (drag, typing, slider) begins
        function beginPendingUndo() {
            if (!pendingSnapshot) {
                pendingSnapshot = cloneState();
            }
        }

        // Commit captured state as the single undo step once gesture completes
        function commitPendingUndo() {
            if (pendingSnapshot && !statesEqual(pendingSnapshot, appState)) {
                undoSnapshot = pendingSnapshot;
                redoSnapshot = null;
                updateUndoRedoButtons();
            }
            pendingSnapshot = null;
        }

        // Record a single-action change immediately (e.g. reflect button, lock toggle)
        function recordImmediateUndo() {
            undoSnapshot = cloneState();
            redoSnapshot = null;
            pendingSnapshot = null;
            updateUndoRedoButtons();
        }

        function performUndo() {
            if (!undoSnapshot) return;
            const prev = undoSnapshot;
            redoSnapshot = cloneState();
            undoSnapshot = null;
            pendingSnapshot = null;
            restoreState(prev);
            updateUndoRedoButtons();
        }

        function performRedo() {
            if (!redoSnapshot) return;
            const next = redoSnapshot;
            undoSnapshot = cloneState();
            redoSnapshot = null;
            pendingSnapshot = null;
            restoreState(next);
            updateUndoRedoButtons();
        }

        /* --- 1. Math & Color Space Conversions --- */

        // Ensure angle interpolates shortest distance
        function shortAngleDist(a, b) {
            let d = (b - a) % 360;
            if (d > 180) d -= 360;
            if (d < -180) d += 360;
            return d;
        }

        // Cubic Bezier (1D)
        function bezier3(p0, p1, p2, p3, t) {
            return (1 - t)**3 * p0 + 3 * (1 - t)**2 * t * p1 + 3 * (1 - t) * t**2 * p2 + t**3 * p3;
        }

        // Color Conversion Functions (OKlch <-> OKlab -> Linear sRGB -> sRGB -> Hex)
        function oklch_to_oklab(l, c, h) {
            let h_rad = h * Math.PI / 180;
            return { L: l, a: c * Math.cos(h_rad), b: c * Math.sin(h_rad) };
        }

        function oklab_to_oklch(L, a, b) {
            let c = Math.sqrt(a * a + b * b);
            let h = Math.atan2(b, a) * 180 / Math.PI;
            if (h < 0) h += 360;
            return { l: L, c: c, h: h };
        }

        // Evaluate segment 1 (Dark -> Mid) at parameter t [0, 1] using OKlab 3D cartesian coordinates
        function getPointAtT1(t, cfg = state) {
            let p0 = oklch_to_oklab(cfg.dark.l, cfg.dark.c, cfg.dark.h);
            let p1 = oklch_to_oklab(cfg.handles.d_out.l, cfg.handles.d_out.c, cfg.handles.d_out.h);
            let p2 = oklch_to_oklab(cfg.handles.m_in.l, cfg.handles.m_in.c, cfg.handles.m_in.h);
            let p3 = oklch_to_oklab(cfg.mid.l, cfg.mid.c, cfg.mid.h);

            let L = bezier3(p0.L, p1.L, p2.L, p3.L, t);
            let a = bezier3(p0.a, p1.a, p2.a, p3.a, t);
            let b = bezier3(p0.b, p1.b, p2.b, p3.b, t);

            return oklab_to_oklch(L, a, b);
        }

        // Evaluate segment 2 (Mid -> Light) at parameter t [0, 1] using OKlab 3D cartesian coordinates
        function getPointAtT2(t, cfg = state) {
            let p0 = oklch_to_oklab(cfg.mid.l, cfg.mid.c, cfg.mid.h);
            let p1 = oklch_to_oklab(cfg.handles.m_out.l, cfg.handles.m_out.c, cfg.handles.m_out.h);
            let p2 = oklch_to_oklab(cfg.handles.l_in.l, cfg.handles.l_in.c, cfg.handles.l_in.h);
            let p3 = oklch_to_oklab(cfg.light.l, cfg.light.c, cfg.light.h);

            let L = bezier3(p0.L, p1.L, p2.L, p3.L, t);
            let a = bezier3(p0.a, p1.a, p2.a, p3.a, t);
            let b = bezier3(p0.b, p1.b, p2.b, p3.b, t);

            return oklab_to_oklch(L, a, b);
        }

        // Euclidean distance in OKlab space
        function dist(p1, p2) {
            let lab1 = oklch_to_oklab(p1.l, p1.c, p1.h);
            let lab2 = oklch_to_oklab(p2.l, p2.c, p2.h);
            return Math.sqrt((lab2.L - lab1.L) ** 2 + (lab2.a - lab1.a) ** 2 + (lab2.b - lab1.b) ** 2);
        }

        function oklab_to_linear_srgb(L, a, b) {
            let l_ = L + 0.3963377774 * a + 0.2158037573 * b;
            let m_ = L - 0.1055613458 * a - 0.0638541728 * b;
            let s_ = L - 0.0894841775 * a - 1.2914855480 * b;
            let l = l_ ** 3, m = m_ ** 3, s = s_ ** 3;
            return {
                r: +4.0767416621 * l - 3.3077115913 * m + 0.2309699292 * s,
                g: -1.2684380046 * l + 2.6097574011 * m - 0.3413193965 * s,
                b: -0.0041960863 * l - 0.7034186147 * m + 1.7076147010 * s
            };
        }

        function linear_srgb_to_srgb(c) {
            let abs = Math.abs(c);
            let val = abs > 0.0031308 ? 1.055 * Math.pow(abs, 1 / 2.4) - 0.055 : 12.92 * c;
            return Math.sign(c) * val;
        }

        function oklch_to_hex(l, c, h) {
            let lab = oklch_to_oklab(l, c, h);
            let lin = oklab_to_linear_srgb(lab.L, lab.a, lab.b);
            let r = Math.max(0, Math.min(1, linear_srgb_to_srgb(lin.r)));
            let g = Math.max(0, Math.min(1, linear_srgb_to_srgb(lin.g)));
            let b = Math.max(0, Math.min(1, linear_srgb_to_srgb(lin.b)));
            let r_h = Math.round(r * 255).toString(16).padStart(2, '0');
            let g_h = Math.round(g * 255).toString(16).padStart(2, '0');
            let b_h = Math.round(b * 255).toString(16).padStart(2, '0');
            return `#${r_h}${g_h}${b_h}`;
        }

        // sRGB Hex -> OKlch (For color picker input syncing)
        function hex_to_srgb(hex) {
            return {
                r: parseInt(hex.substring(1, 3), 16) / 255,
                g: parseInt(hex.substring(3, 5), 16) / 255,
                b: parseInt(hex.substring(5, 7), 16) / 255
            };
        }

        function srgb_to_linear(c) {
            return c >= 0.04045 ? Math.pow((c + 0.055) / 1.055, 2.4) : c / 12.92;
        }

        function linear_srgb_to_oklab(r, g, b) {
            let l = Math.cbrt(0.4122214708 * r + 0.5363325363 * g + 0.0514459929 * b);
            let m = Math.cbrt(0.2119034982 * r + 0.6806995451 * g + 0.1073969566 * b);
            let s = Math.cbrt(0.0883024619 * r + 0.2817188376 * g + 0.6299787005 * b);
            return {
                L: 0.2104542553 * l + 0.7936177850 * m - 0.0040720468 * s,
                a: 1.9779984951 * l - 2.4285922050 * m + 0.4505937099 * s,
                b: 0.0259040371 * l + 0.7827717662 * m - 0.8086757660 * s
            };
        }

        function hex_to_oklch(hex) {
            let rgb = hex_to_srgb(hex);
            let lr = srgb_to_linear(rgb.r), lg = srgb_to_linear(rgb.g), lb = srgb_to_linear(rgb.b);
            let lab = linear_srgb_to_oklab(lr, lg, lb);
            return oklab_to_oklch(lab.L, lab.a, lab.b);
        }

        /* --- 2. Curve Sampling & Palette Generation --- */

        // Build data arrays of the curve by sampling evenly across parameter t
        function buildCurveData(getPointFn) {
            let pts = [];
            let totalLen = 0;
            let lastPt = getPointFn(0);
            lastPt.c = Math.max(0, Math.min(MAX_C, lastPt.c));
            pts.push({ t: 0, l: lastPt.l, c: lastPt.c, h: lastPt.h, len: 0 });
            
            const samples = 100;
            for (let i = 1; i <= samples; i++) {
                let t = i / samples;
                let pt = getPointFn(t);
                pt.c = Math.max(0, Math.min(MAX_C, pt.c));
                totalLen += dist(lastPt, pt);
                pts.push({ t, l: pt.l, c: pt.c, h: pt.h, len: totalLen });
                lastPt = pt;
            }
            return { pts, totalLen };
        }

        // Fetch interpolated position at an exact length distance along the curve
        function getPointAtLength(curveData, targetLen) {
            if (targetLen <= 0) return curveData.pts[0];
            if (targetLen >= curveData.totalLen) return curveData.pts[curveData.pts.length - 1];
            
            for (let i = 0; i < curveData.pts.length - 1; i++) {
                let p1 = curveData.pts[i];
                let p2 = curveData.pts[i + 1];
                if (targetLen >= p1.len && targetLen <= p2.len) {
                    let ratio = (targetLen - p1.len) / (p2.len - p1.len);
                    return {
                        l: p1.l + ratio * (p2.l - p1.l),
                        c: p1.c + ratio * (p2.c - p1.c),
                        h: p1.h + shortAngleDist(p1.h, p2.h) * ratio
                    };
                }
            }
        }

        // Logic for dispersing the color stops evenly, pinning the middle swatch to Mid Color
        function generatePalette(cfg = state) {
            let n = cfg.steps;
            if (n < 3) return [cfg.dark, cfg.light]; 

            let d2m = buildCurveData(t => getPointAtT1(t, cfg));
            let m2l = buildCurveData(t => getPointAtT2(t, cfg));
            let L1 = d2m.totalLen;
            let L2 = m2l.totalLen;
            let totalLen = L1 + L2;

            let idealStep = totalLen / (n - 1);
            let midIndex = Math.round(L1 / idealStep);
            
            // Constrain midIndex bounds so we have stops on both sides
            if (midIndex <= 0) midIndex = 1;
            if (midIndex >= n - 1) midIndex = n - 2;

            let palette = [];
            
            // Distribute D to M
            for (let i = 0; i <= midIndex; i++) {
                if (i === 0) palette.push(cfg.dark);
                else if (i === midIndex) palette.push(cfg.mid);
                else palette.push(getPointAtLength(d2m, (i / midIndex) * L1));
            }
            
            // Distribute M to L
            let remaining = n - 1 - midIndex;
            for (let i = 1; i <= remaining; i++) {
                if (i === remaining) palette.push(cfg.light);
                else palette.push(getPointAtLength(m2l, (i / remaining) * L2));
            }
            return palette;
        }

            // Undo / Redo buttons & keyboard shortcuts
            document.getElementById('undo-btn').addEventListener('click', performUndo);
            document.getElementById('redo-btn').addEventListener('click', performRedo);
            window.addEventListener('keydown', (e) => {
                const tag = document.activeElement?.tagName;
                if (tag === 'INPUT' && (document.activeElement.type === 'text' || document.activeElement.type === 'number')) {
                    return;
                }
                if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z') {
                    e.preventDefault();
                    if (e.shiftKey) performRedo();
                    else performUndo();
                } else if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'y') {
                    e.preventDefault();
                    performRedo();
                }
            });

            // Reflection / Inversion buttons
            function getAllNodes() {
                return [
                    state.dark, state.mid, state.light,
                    state.handles.d_out, state.handles.m_in, state.handles.m_out, state.handles.l_in
                ];
            }

            document.getElementById('reflect-lc-l').addEventListener('click', () => {
                recordImmediateUndo();
                getAllNodes().forEach(p => {
                    p.l = Math.max(0, Math.min(1, 1 - p.l));
                });
                updateAll();
            });

            document.getElementById('reflect-lc-c').addEventListener('click', () => {
                recordImmediateUndo();
                getAllNodes().forEach(p => {
                    p.c = Math.max(0, Math.min(MAX_C, 0.4 - p.c));
                });
                updateAll();
            });

            document.getElementById('reflect-hc-h').addEventListener('click', () => {
                recordImmediateUndo();
                getAllNodes().forEach(p => {
                    p.h = ((360 - p.h) % 360 + 360) % 360;
                });
                updateAll();
            });

            document.getElementById('reflect-hc-c').addEventListener('click', () => {
                recordImmediateUndo();
                getAllNodes().forEach(p => {
                    p.c = Math.max(0, Math.min(MAX_C, 0.4 - p.c));
                });
                updateAll();
            });

            // Add new palette row (clones the previous row and selects the newly added row)
            document.getElementById('add-palette-btn').addEventListener('click', () => {
                recordImmediateUndo();
                const prevRow = appState.palettes[appState.palettes.length - 1];
                const newRow = clonePaletteConfig(prevRow);
                appState.palettes.push(newRow);
                appState.activeIndex = appState.palettes.length - 1;
                state = appState.palettes[appState.activeIndex];
                updateAll();
                const listEl = document.getElementById('palettes-list');
                if (listEl) listEl.scrollTop = listEl.scrollHeight;
            });
        }

        function selectPaletteRow(index) {
            if (index < 0 || index >= appState.palettes.length || index === appState.activeIndex) return;
            recordImmediateUndo();
            appState.activeIndex = index;
            state = appState.palettes[appState.activeIndex];
            updateAll();
        }

        function deletePaletteRow(index) {
            if (index <= 0 || index >= appState.palettes.length) return;
            recordImmediateUndo();
            appState.palettes.splice(index, 1);
            if (appState.activeIndex >= appState.palettes.length) {
                appState.activeIndex = appState.palettes.length - 1;
            } else if (index < appState.activeIndex) {
                appState.activeIndex -= 1;
            }
            state = appState.palettes[appState.activeIndex];
            updateAll();
        }

        // Export all palette rows together into a single Infinite Painter .clrs JSON file
        function exportInfinitePainterClrs() {
            const colors = [];
            appState.palettes.forEach(cfg => {
                const palette = generatePalette(cfg);
                palette.forEach(p => {
                    const hex = oklch_to_hex(p.l, p.c, p.h);
                    const r = parseInt(hex.substring(1, 3), 16);
                    const g = parseInt(hex.substring(3, 5), 16);
                    const b = parseInt(hex.substring(5, 7), 16);
                    colors.push(((0xFF << 24) | (r << 16) | (g << 8) | b) >> 0);
                });
            });

            const payload = JSON.stringify({
                name: "OKlch Palette",
                colors: colors
            }, null, 2);

            const blob = new Blob([payload], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `oklch_palette_${appState.palettes.length}rows_${colors.length}.clrs`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        // Sanitize and export/import full generator configuration (excluding undo memory)
        function sanitizePoint(pt, fallback) {
            if (!pt || typeof pt !== 'object') return { ...fallback };
            const l = Number.isFinite(Number(pt.l)) ? Math.max(0, Math.min(1, Number(pt.l))) : fallback.l;
            const c = Number.isFinite(Number(pt.c)) ? Math.max(0, Math.min(MAX_C, Number(pt.c))) : fallback.c;
            const rawH = Number(pt.h);
            const h = Number.isFinite(rawH) ? ((rawH % 360) + 360) % 360 : fallback.h;
            return { l, c, h };
        }

        function sanitizePaletteConfig(raw) {
            const def = createDefaultPaletteConfig();
            if (!raw || typeof raw !== 'object') return def;
            const rawHandles = (raw.handles && typeof raw.handles === 'object') ? raw.handles : {};
            const rawLocked = (raw.locked && typeof raw.locked === 'object') ? raw.locked : {};
            const rawSteps = parseInt(raw.steps, 10);
            const steps = Number.isFinite(rawSteps) ? Math.max(3, Math.min(256, rawSteps)) : def.steps;

            return {
                dark: sanitizePoint(raw.dark, def.dark),
                mid: sanitizePoint(raw.mid, def.mid),
                light: sanitizePoint(raw.light, def.light),
                handles: {
                    d_out: sanitizePoint(rawHandles.d_out, def.handles.d_out),
                    m_in: sanitizePoint(rawHandles.m_in, def.handles.m_in),
                    m_out: sanitizePoint(rawHandles.m_out, def.handles.m_out),
                    l_in: sanitizePoint(rawHandles.l_in, def.handles.l_in)
                },
                locked: {
                    dark: Boolean(rawLocked.dark),
                    mid: Boolean(rawLocked.mid),
                    light: Boolean(rawLocked.light)
                },
                steps
            };
        }

        function exportConfigurationJson() {
            const data = {
                version: 1,
                activeIndex: appState.activeIndex,
                palettes: appState.palettes.map(clonePaletteConfig)
            };
            const payload = JSON.stringify(data, null, 2);
            const blob = new Blob([payload], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `oklch_palettes_config_${appState.palettes.length}.json`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        function importConfigurationJson(file) {
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (event) => {
                try {
                    const parsed = JSON.parse(event.target.result);
                    let rawPalettes = null;
                    let nextActive = 0;

                    if (Array.isArray(parsed)) {
                        rawPalettes = parsed;
                    } else if (parsed && typeof parsed === 'object') {
                        if (Array.isArray(parsed.palettes)) {
                            rawPalettes = parsed.palettes;
                            if (Number.isInteger(parsed.activeIndex)) {
                                nextActive = parsed.activeIndex;
                            }
                        } else if (parsed.dark || parsed.mid || parsed.light) {
                            rawPalettes = [parsed];
                        }
                    }

                    if (!rawPalettes || rawPalettes.length === 0) {
                        throw new Error('No valid palette configurations found in JSON.');
                    }

                    recordImmediateUndo();
                    appState.palettes = rawPalettes.map(sanitizePaletteConfig);
                    appState.activeIndex = Math.max(0, Math.min(nextActive, appState.palettes.length - 1));
                    state = appState.palettes[appState.activeIndex];
                    updateAll();
                } catch (err) {
                    alert(`Failed to import JSON configuration: ${err.message}`);
                }
            };
            reader.readAsText(file);
        }

        // Sync Sidebar UI components based on internal state
        function syncSidebar(skipInputId = null) {
            const lockSvgClosed = `<svg class="w-4 h-4" fill="currentColor" viewBox="0 0 20 20"><path d="M5 9V7a5 5 0 0110 0v2a2 2 0 012 2v5a2 2 0 01-2 2H5a2 2 0 01-2-2v-5a2 2 0 012-2zm8-2v2H7V7a3 3 0 016 0z" clip-rule="evenodd" fill-rule="evenodd"></path></svg>`;
            const lockSvgOpen = `<svg class="w-4 h-4" fill="currentColor" viewBox="0 0 20 20"><path d="M10 2a5 5 0 00-5 5v2a2 2 0 00-2 2v5a2 2 0 002 2h10a2 2 0 002-2v-5a2 2 0 00-2-2H7V7a3 3 0 015.905-.75 1 1 0 001.937-.5A5.002 5.002 0 0010 2z"></path></svg>`;

            keys.forEach(k => {
                document.getElementById(`l-${k}`).value = state[k].l;
                document.getElementById(`c-${k}`).value = state[k].c;
                document.getElementById(`h-${k}`).value = state[k].h;
                
                if (skipInputId !== `val-l-${k}`) {
                    document.getElementById(`val-l-${k}`).value = state[k].l.toFixed(2);
                }

                    document.getElementById(`val-c-${k}`).value = state[k].c.toFixed(3);
                }
                if (skipInputId !== `val-h-${k}`) {
                    document.getElementById(`val-h-${k}`).value = Math.round(state[k].h);
                }
                
                let hex = oklch_to_hex(state[k].l, state[k].c, state[k].h);
                document.getElementById(`hex-${k}`).value = hex;
                if (skipInputId !== `text-${k}`) {
                    document.getElementById(`text-${k}`).value = hex;
                }
                
                // Handle Locks UI
                let isLocked = state.locked[k];
                document.getElementById(`lock-icon-${k}`).innerHTML = isLocked ? lockSvgClosed : lockSvgOpen;
                document.getElementById(`lock-${k}`).className = isLocked ? "text-white transition-colors p-1" : "text-slate-500 hover:text-white transition-colors p-1";
                document.getElementById(`section-${k}`).style.opacity = isLocked ? "0.6" : "1";
                
                ['l', 'c', 'h', 'hex', 'text', 'val-l', 'val-c', 'val-h'].forEach(prop => {
