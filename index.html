                });

                // Dynamic slider backgrounds
                document.getElementById(`l-${k}`).style.background = `linear-gradient(to right, oklch(0 ${state[k].c} ${state[k].h}), oklch(1 ${state[k].c} ${state[k].h}))`;
                document.getElementById(`c-${k}`).style.background = `linear-gradient(to right, oklch(${state[k].l} 0 ${state[k].h}), oklch(${state[k].l} ${MAX_C} ${state[k].h}))`;
                
                let hGrad = [];
                for(let i=0; i<=6; i++) {
                    hGrad.push(`oklch(${state[k].l} ${state[k].c} ${i*60})`);
                }
                document.getElementById(`h-${k}`).style.background = `linear-gradient(to right, ${hGrad.join(', ')})`;
            });
            document.getElementById('steps').value = state.steps;
            document.getElementById('steps-num').value = state.steps;
        }

        // Coordinates Mapping to SVG dimensions (300x300 canvas)
        const S = 300, H = 150;
        function mapLC_X(c) { return (c / MAX_C) * S; }
        function mapLC_Y(l) { return (1 - l) * S; } // Y inverted
        function mapHC_X(c, h) { return H + (c / MAX_C) * H * Math.cos(h * Math.PI / 180); }
        function mapHC_Y(c, h) { return H - (c / MAX_C) * H * Math.sin(h * Math.PI / 180); }

        function drawGrids() {
            // L-C Grid
            let gridLC = `<g stroke="#334155" stroke-width="1" stroke-dasharray="2">`;
            for(let i=0; i<=4; i++) {
                gridLC += `<line x1="${(i/4)*S}" y1="0" x2="${(i/4)*S}" y2="${S}" />`;
                gridLC += `<line x1="0" y1="${(i/4)*S}" x2="${S}" y2="${(i/4)*S}" />`;
            }
            gridLC += `</g>`;
            document.getElementById('lc-grid').innerHTML = gridLC;

            // H-C Grid
            let gridHC = `<g stroke="#334155" stroke-width="1" stroke-dasharray="2">`;
            for(let i=1; i<=4; i++) {
                gridHC += `<circle cx="${H}" cy="${H}" r="${(i/4)*H}" fill="none" />`;
            }
            for(let i=0; i<8; i++) {
                let a = (i/8) * 2 * Math.PI;
                gridHC += `<line x1="${H}" y1="${H}" x2="${H + H*Math.cos(a)}" y2="${H - H*Math.sin(a)}" />`;
            }
            gridHC += `</g>`;
            document.getElementById('hc-grid').innerHTML = gridHC;
        }

        function initHCBackground() {
            // HC Background - Radial distance = chroma, Angle = Hue (Lightness locked at 0.5)
            // Rendered only once since it doesn't depend on dynamically changing parameters
            const hcCtx = document.getElementById('bg-hc').getContext('2d');
            const hcImg = hcCtx.createImageData(300, 300);
            for (let y = 0; y < 300; y++) {
                for (let x = 0; x < 300; x++) {
                    let dx = x - 150;
                    let dy = 150 - y;
                    let r = Math.sqrt(dx*dx + dy*dy);
                    if (r > 150) continue;
                    let a = Math.atan2(dy, dx) * 180 / Math.PI;
                    if (a < 0) a += 360;
                    let c = (r / 150) * MAX_C;
                    let hex = oklch_to_hex(0.5, c, a);
                    let rgb = hex_to_srgb(hex);
                    let idx = (y * 300 + x) * 4;
                    hcImg.data[idx] = rgb.r * 255;
                    hcImg.data[idx+1] = rgb.g * 255;
                    hcImg.data[idx+2] = rgb.b * 255;
                    hcImg.data[idx+3] = 70; // Transparent to keep grids visible
                }
            }
            hcCtx.putImageData(hcImg, 0, 0);
        }

        let cachedMidHue = null;
        function renderLCBackground() {
            // LC Background - Lightness changes vertically, hue syncs with middle stop
            // We cache it so we only re-run the pixel loop if the hue genuinely changed during dragging
            if (cachedMidHue === state.mid.h) return;
            cachedMidHue = state.mid.h;

            const lcCtx = document.getElementById('bg-lc').getContext('2d');
            const lcImg = lcCtx.createImageData(300, 300);
            let midH = state.mid.h;
            
            for (let y = 0; y < 300; y++) {
                for (let x = 0; x < 300; x++) {
                    let l = 1 - (y / 300);
                    let c = (x / 300) * MAX_C;
                    let hex = oklch_to_hex(l, c, midH);
                    let rgb = hex_to_srgb(hex);
                    let idx = (y * 300 + x) * 4;
                    lcImg.data[idx] = rgb.r * 255;
                    lcImg.data[idx+1] = rgb.g * 255;
                    lcImg.data[idx+2] = rgb.b * 255;
                    lcImg.data[idx+3] = 70; // Transparent to keep grids visible
                }
            }
            lcCtx.putImageData(lcImg, 0, 0);
        }

        function setLine(id, x1, y1, x2, y2) {
            let el = document.getElementById(id);
            el.setAttribute('x1', x1); el.setAttribute('y1', y1);
            el.setAttribute('x2', x2); el.setAttribute('y2', y2);
        }

        function setPt(id, x, y) {
            let el = document.getElementById(id);
            el.setAttribute('cx', x); el.setAttribute('cy', y);
        }

        function getPolyline(pts, mapX, mapY) {
            return pts.reduce((acc, p, i) => acc + (i === 0 ? "M " : "L ") + `${mapX(p)} ${mapY(p)} `, "");
        }

        function updateSVGs() {
            // Render non-selected palettes as 25% opacity non-interactive ghosts
            const lcGhosts = document.getElementById('lc-ghosts');
            const hcGhosts = document.getElementById('hc-ghosts');
            let lcGhostHtml = '';
            let hcGhostHtml = '';

            appState.palettes.forEach((cfg, idx) => {
                if (idx === appState.activeIndex) return;
                const gD2m = buildCurveData(t => getPointAtT1(t, cfg)).pts;
                const gM2l = buildCurveData(t => getPointAtT2(t, cfg)).pts;

                const lcD1 = getPolyline(gD2m, p => mapLC_X(p.c), p => mapLC_Y(p.l));
                const lcD2 = getPolyline(gM2l, p => mapLC_X(p.c), p => mapLC_Y(p.l));

                const hcD1 = getPolyline(gD2m, p => mapHC_X(p.c, p.h), p => mapHC_Y(p.c, p.h));
                const hcD2 = getPolyline(gM2l, p => mapHC_X(p.c, p.h), p => mapHC_Y(p.c, p.h));

                let lcStopsHtml = '';
                let hcStopsHtml = '';
                keys.forEach(k => {
                    const pt = cfg[k];
                    const hex = oklch_to_hex(pt.l, pt.c, pt.h);
                    const lx = mapLC_X(pt.c);
                    const ly = mapLC_Y(pt.l);
                    const hx = mapHC_X(pt.c, pt.h);
                    const hy = mapHC_Y(pt.c, pt.h);

                    lcStopsHtml += `<circle cx="${lx}" cy="${ly}" r="7" fill="#f8fafc" stroke="#0f172a" stroke-width="2" />` +
                                   `<circle cx="${lx}" cy="${ly}" r="3.5" fill="${hex}" />`;
                    hcStopsHtml += `<circle cx="${hx}" cy="${hy}" r="7" fill="#f8fafc" stroke="#0f172a" stroke-width="2" />` +
                                   `<circle cx="${hx}" cy="${hy}" r="3.5" fill="${hex}" />`;
                });

                lcGhostHtml += `<g opacity="0.25"><path d="${lcD1}" class="curve-1" /><path d="${lcD2}" class="curve-2" />${lcStopsHtml}</g>`;
                hcGhostHtml += `<g opacity="0.25"><path d="${hcD1}" class="curve-1" /><path d="${hcD2}" class="curve-2" />${hcStopsHtml}</g>`;
            });

            lcGhosts.innerHTML = lcGhostHtml;
            hcGhosts.innerHTML = hcGhostHtml;

            let d2m = buildCurveData(getPointAtT1).pts;
            let m2l = buildCurveData(getPointAtT2).pts;

            // L-C Paths - now perfectly following the OKlab evaluated points
            document.getElementById('lc-curve-1').setAttribute('d', getPolyline(d2m, p => mapLC_X(p.c), p => mapLC_Y(p.l)));
            document.getElementById('lc-curve-2').setAttribute('d', getPolyline(m2l, p => mapLC_X(p.c), p => mapLC_Y(p.l)));

            // H-C Paths 
            document.getElementById('hc-curve-1').setAttribute('d', getPolyline(d2m, p => mapHC_X(p.c, p.h), p => mapHC_Y(p.c, p.h)));
            document.getElementById('hc-curve-2').setAttribute('d', getPolyline(m2l, p => mapHC_X(p.c, p.h), p => mapHC_Y(p.c, p.h)));

            // Handles LC
            setLine('lc-h1-line', mapLC_X(state.dark.c), mapLC_Y(state.dark.l), mapLC_X(state.handles.d_out.c), mapLC_Y(state.handles.d_out.l));
            setLine('lc-h2-line', mapLC_X(state.handles.m_in.c), mapLC_Y(state.handles.m_in.l), mapLC_X(state.mid.c), mapLC_Y(state.mid.l));
            setLine('lc-h3-line', mapLC_X(state.mid.c), mapLC_Y(state.mid.l), mapLC_X(state.handles.m_out.c), mapLC_Y(state.handles.m_out.l));
            setLine('lc-h4-line', mapLC_X(state.handles.l_in.c), mapLC_Y(state.handles.l_in.l), mapLC_X(state.light.c), mapLC_Y(state.light.l));

            // Handles HC
            setLine('hc-h1-line', mapHC_X(state.dark.c, state.dark.h), mapHC_Y(state.dark.c, state.dark.h), mapHC_X(state.handles.d_out.c, state.handles.d_out.h), mapHC_Y(state.handles.d_out.c, state.handles.d_out.h));
            setLine('hc-h2-line', mapHC_X(state.handles.m_in.c, state.handles.m_in.h), mapHC_Y(state.handles.m_in.c, state.handles.m_in.h), mapHC_X(state.mid.c, state.mid.h), mapHC_Y(state.mid.c, state.mid.h));
            setLine('hc-h3-line', mapHC_X(state.mid.c, state.mid.h), mapHC_Y(state.mid.c, state.mid.h), mapHC_X(state.handles.m_out.c, state.handles.m_out.h), mapHC_Y(state.handles.m_out.c, state.handles.m_out.h));
            setLine('hc-h4-line', mapHC_X(state.handles.l_in.c, state.handles.l_in.h), mapHC_Y(state.handles.l_in.c, state.handles.l_in.h), mapHC_X(state.light.c, state.light.h), mapHC_Y(state.light.c, state.light.h));

            // Nodes LC
            setPt('lc-d', mapLC_X(state.dark.c), mapLC_Y(state.dark.l));
            setPt('lc-m', mapLC_X(state.mid.c), mapLC_Y(state.mid.l));
            setPt('lc-l', mapLC_X(state.light.c), mapLC_Y(state.light.l));
            setPt('lc-h-d-out', mapLC_X(state.handles.d_out.c), mapLC_Y(state.handles.d_out.l));
            setPt('lc-h-m-in', mapLC_X(state.handles.m_in.c), mapLC_Y(state.handles.m_in.l));
            setPt('lc-h-m-out', mapLC_X(state.handles.m_out.c), mapLC_Y(state.handles.m_out.l));
            setPt('lc-h-l-in', mapLC_X(state.handles.l_in.c), mapLC_Y(state.handles.l_in.l));

            // Nodes HC
            setPt('hc-d', mapHC_X(state.dark.c, state.dark.h), mapHC_Y(state.dark.c, state.dark.h));
            setPt('hc-m', mapHC_X(state.mid.c, state.mid.h), mapHC_Y(state.mid.c, state.mid.h));
            setPt('hc-l', mapHC_X(state.light.c, state.light.h), mapHC_Y(state.light.c, state.light.h));
            setPt('hc-h-d-out', mapHC_X(state.handles.d_out.c, state.handles.d_out.h), mapHC_Y(state.handles.d_out.c, state.handles.d_out.h));
            setPt('hc-h-m-in', mapHC_X(state.handles.m_in.c, state.handles.m_in.h), mapHC_Y(state.handles.m_in.c, state.handles.m_in.h));
            setPt('hc-h-m-out', mapHC_X(state.handles.m_out.c, state.handles.m_out.h), mapHC_Y(state.handles.m_out.c, state.handles.m_out.h));
            setPt('hc-h-l-in', mapHC_X(state.handles.l_in.c, state.handles.l_in.h), mapHC_Y(state.handles.l_in.c, state.handles.l_in.h));

            // Inner Nodes Colors
            ['d', 'm', 'l'].forEach(k => {
                let pt = state[k === 'd' ? 'dark' : (k === 'm' ? 'mid' : 'light')];
                let hex = oklch_to_hex(pt.l, pt.c, pt.h);
                document.getElementById(`lc-${k}-inner`).style.color = hex;
                document.getElementById(`hc-${k}-inner`).style.color = hex;
                setPt(`lc-${k}-inner`, mapLC_X(pt.c), mapLC_Y(pt.l));
                setPt(`hc-${k}-inner`, mapHC_X(pt.c, pt.h), mapHC_Y(pt.c, pt.h));
            });
        }

        // Mouse Handlers for SVG dragging
        function initInteractions() {
            const svgLC = document.getElementById('svg-lc');
            const svgHC = document.getElementById('svg-hc');
            
            function register(id, space, targetType, targetKey) {
                document.getElementById(id).addEventListener('mousedown', (e) => {
                    e.stopPropagation();
                    let k = targetType === 'point' ? targetKey : null;
                    if (k && state.locked[k]) return; // Block drag if locked
                    
                    dragging = { type: targetType, key: targetKey };
                    dragSpace = space;
                    dragChanged = false;
                    beginPendingUndo();
                });
                document.getElementById(id).addEventListener('touchstart', (e) => {
                    e.stopPropagation();
                    let k = targetType === 'point' ? targetKey : null;
                    if (k && state.locked[k]) return;
                    
                    dragging = { type: targetType, key: targetKey };
                    dragSpace = space;
                    dragChanged = false;
                    beginPendingUndo();
                }, {passive: true});
            }

            // Register points
            register('lc-d', 'LC', 'point', 'dark');
            register('lc-m', 'LC', 'point', 'mid');
            register('lc-l', 'LC', 'point', 'light');
            register('hc-d', 'HC', 'point', 'dark');
            register('hc-m', 'HC', 'point', 'mid');
            register('hc-l', 'HC', 'point', 'light');

            // Register handles
            register('lc-h-d-out', 'LC', 'handle', 'd_out');
            register('lc-h-m-in',  'LC', 'handle', 'm_in');
            register('lc-h-m-out', 'LC', 'handle', 'm_out');
            register('lc-h-l-in',  'LC', 'handle', 'l_in');
            register('hc-h-d-out', 'HC', 'handle', 'd_out');
            register('hc-h-m-in',  'HC', 'handle', 'm_in');
            register('hc-h-m-out', 'HC', 'handle', 'm_out');
            register('hc-h-l-in',  'HC', 'handle', 'l_in');

            function getMouseCoords(e, svg) {
                let clientX = e.touches ? e.touches[0].clientX : e.clientX;
                let clientY = e.touches ? e.touches[0].clientY : e.clientY;
                let pt = svg.createSVGPoint();
                pt.x = clientX; pt.y = clientY;
                return pt.matrixTransform(svg.getScreenCTM().inverse());
            }

            // Register SVG background dragging for global stop/handle translation
            function registerBackgroundDrag(svg, space) {
                function startBgDrag(e) {
                    if (e.target && e.target.classList && e.target.classList.contains('point')) return;
                    bgDragging = true;
                    bgDragSpace = space;
                    bgStartLoc = getMouseCoords(e, svg);
                    bgStartState = clonePaletteConfig(state);
                    dragChanged = false;
                    beginPendingUndo();
                    svg.classList.add('is-panning');

                    if (space === 'HC') {
                        const dx0 = bgStartLoc.x - H;
                        const dy0 = H - bgStartLoc.y;
                        bgPrevAngle = Math.atan2(dy0, dx0) * 180 / Math.PI;
                        bgCumDH = 0;
                    }
                }
                svg.addEventListener('mousedown', startBgDrag);
                svg.addEventListener('touchstart', startBgDrag, { passive: true });
            }

            registerBackgroundDrag(svgLC, 'LC');
            registerBackgroundDrag(svgHC, 'HC');

            function applyBackgroundDrag(loc, shiftPressed) {
                if (!bgDragging || !bgStartState) return;
                dragChanged = true;

                if (bgDragSpace === 'LC') {
                    let dx = loc.x - bgStartLoc.x;
                    let dy = loc.y - bgStartLoc.y;

                    if (shiftPressed) {
                        if (Math.abs(dx) >= Math.abs(dy)) dy = 0;
                        else dx = 0;
                    }

                    const dC = (dx / S) * MAX_C;
                    const dL = -(dy / S);

                    keys.forEach(k => {
                        if (!bgStartState.locked[k]) {
                            state[k].l = Math.max(0, Math.min(1, bgStartState[k].l + dL));
                            state[k].c = Math.max(0, Math.min(MAX_C, bgStartState[k].c + dC));
                        }
                    });

                    ['d_out', 'm_in', 'm_out', 'l_in'].forEach(hk => {
                        state.handles[hk].l = Math.max(0, Math.min(1, bgStartState.handles[hk].l + dL));
                        state.handles[hk].c = Math.max(0, Math.min(MAX_C, bgStartState.handles[hk].c + dC));
                    });
                } else {
                    const dx0 = bgStartLoc.x - H;
                    const dy0 = H - bgStartLoc.y;
                    const r0 = Math.sqrt(dx0 * dx0 + dy0 * dy0);

                    const dx1 = loc.x - H;
                    const dy1 = H - loc.y;
                    const r1 = Math.sqrt(dx1 * dx1 + dy1 * dy1);
                    const a1 = Math.atan2(dy1, dx1) * 180 / Math.PI;

                    bgCumDH += shortAngleDist(bgPrevAngle, a1);
                    bgPrevAngle = a1;

                    let dr = r1 - r0;
                    let dH = bgCumDH;

                    if (shiftPressed) {
                        const radialDist = Math.abs(dr);
                        const rRef = Math.max(20, (r0 + r1) / 2);
                        const angularDist = rRef * Math.abs(dH * Math.PI / 180);
                        if (radialDist >= angularDist) dH = 0;
                        else dr = 0;
                    }

                    const dC = (dr / H) * MAX_C;

                    keys.forEach(k => {
                        if (!bgStartState.locked[k]) {
                            state[k].c = Math.max(0, Math.min(MAX_C, bgStartState[k].c + dC));
                            state[k].h = ((bgStartState[k].h + dH) % 360 + 360) % 360;
                        }
                    });

                    ['d_out', 'm_in', 'm_out', 'l_in'].forEach(hk => {
                        state.handles[hk].c = Math.max(0, Math.min(MAX_C, bgStartState.handles[hk].c + dC));
                        state.handles[hk].h = ((bgStartState.handles[hk].h + dH) % 360 + 360) % 360;
                    });
                }

                updateAll();
            }

            function handleMove(e) {
                if (bgDragging) {
                    const svg = bgDragSpace === 'LC' ? svgLC : svgHC;
                    const loc = getMouseCoords(e, svg);
                    lastBgMoveEvent = { loc, shiftKey: !!e.shiftKey };
                    applyBackgroundDrag(loc, !!e.shiftKey);
                    return;
                }
                if (!dragging) return;
                dragChanged = true;
                let svg = dragSpace === 'LC' ? svgLC : svgHC;
                let loc = getMouseCoords(e, svg);
                
                let targetObj = dragging.type === 'point' ? state[dragging.key] : state.handles[dragging.key];

                let old_m_lab = null;
                if (dragging.key === 'mid' && dragging.type === 'point') {
                    old_m_lab = oklch_to_oklab(state.mid.l, state.mid.c, state.mid.h);
                }

                if (dragSpace === 'LC') {
                    let c = (loc.x / S) * MAX_C;
                    let l = 1 - (loc.y / S);
                    targetObj.c = Math.max(0, Math.min(MAX_C, c));
                    targetObj.l = Math.max(0, Math.min(1, l));
                } else {
                    let dx = loc.x - H;
                    let dy = H - loc.y; // Un-invert Y for trig
                    let r = Math.sqrt(dx*dx + dy*dy);
                    let a = Math.atan2(dy, dx) * 180 / Math.PI;
                    if (a < 0) a += 360;
                    
                    targetObj.c = Math.max(0, Math.min(MAX_C, (r / H) * MAX_C));
                    targetObj.h = a;
                }

                // If moving Mid, cleanly shift its handles using OKlab Cartesian space
                if (old_m_lab) {
                    let new_m_lab = oklch_to_oklab(state.mid.l, state.mid.c, state.mid.h);
                    let dL = new_m_lab.L - old_m_lab.L;
                    let da = new_m_lab.a - old_m_lab.a;
                    let db = new_m_lab.b - old_m_lab.b;

                    ['m_in', 'm_out'].forEach(hk => {
                        let hndl = state.handles[hk];
                        let labH = oklch_to_oklab(hndl.l, hndl.c, hndl.h);
                        let newLch = oklab_to_oklch(labH.L + dL, labH.a + da, labH.b + db);
                        hndl.l = Math.max(0, Math.min(1, newLch.l));
                        hndl.c = Math.max(0, Math.min(MAX_C, newLch.c));
                        hndl.h = newLch.h;
                    });
                }

                // Sync collinear mid handles identically to maintain C1 continuity in OKlab space (different lengths allowed)
                if (dragging.key === 'm_in' || dragging.key === 'm_out') {
                    let masterKey = dragging.key;
                    let syncKey = masterKey === 'm_in' ? 'm_out' : 'm_in';
                    
                    let pMaster = state.handles[masterKey];
                    let pSync = state.handles[syncKey];
                    
                    let labM = oklch_to_oklab(state.mid.l, state.mid.c, state.mid.h);
                    let labMaster = oklch_to_oklab(pMaster.l, pMaster.c, pMaster.h);
                    let labSync = oklch_to_oklab(pSync.l, pSync.c, pSync.h);

                    // Compute vector from Mid to Master and Mid to Sync
                    let vMaster = { L: labMaster.L - labM.L, a: labMaster.a - labM.a, b: labMaster.b - labM.b };
                    let vSync = { L: labSync.L - labM.L, a: labSync.a - labM.a, b: labSync.b - labM.b };

                    let lenMaster = Math.sqrt(vMaster.L**2 + vMaster.a**2 + vMaster.b**2);
                    let lenSync = Math.sqrt(vSync.L**2 + vSync.a**2 + vSync.b**2);

                    if (lenMaster > 0) {
                        let k = lenSync / lenMaster;
                        let newL = labM.L - vMaster.L * k;
                        let newA = labM.a - vMaster.a * k;
                        let newB = labM.b - vMaster.b * k;

                        let newLch = oklab_to_oklch(newL, newA, newB);
                        pSync.l = Math.max(0, Math.min(1, newLch.l));
                        pSync.c = Math.max(0, Math.min(MAX_C, newLch.c));
                        pSync.h = newLch.h;
                    }
                }

                updateAll();
            }

            function finishDrag() {
                if (dragging || bgDragging) {
                    if (dragChanged) {
                        commitPendingUndo();
                    } else {
                        pendingSnapshot = null;
                    }
                }
                dragging = null;
                bgDragging = false;
                bgDragSpace = null;
                bgStartLoc = null;
                bgStartState = null;
                lastBgMoveEvent = null;
                svgLC.classList.remove('is-panning');
                svgHC.classList.remove('is-panning');
            }

            window.addEventListener('mousemove', handleMove);
            window.addEventListener('touchmove', handleMove, { passive: true });
            window.addEventListener('mouseup', finishDrag);
            window.addEventListener('touchend', finishDrag);
            window.addEventListener('keydown', (e) => {
                if (e.key === 'Shift' && bgDragging && lastBgMoveEvent) {
                    applyBackgroundDrag(lastBgMoveEvent.loc, true);
                }
            });
            window.addEventListener('keyup', (e) => {
                if (e.key === 'Shift' && bgDragging && lastBgMoveEvent) {
                    applyBackgroundDrag(lastBgMoveEvent.loc, false);
                }
            });
        }

        // Render all palette rows in the footer
        function renderAllPaletteRows(activePalette) {
            const listContainer = document.getElementById('palettes-list');
            listContainer.innerHTML = '';

            appState.palettes.forEach((cfg, rowIndex) => {
                const isSelected = rowIndex === appState.activeIndex;
                const palette = isSelected ? activePalette : generatePalette(cfg);

                const rowEl = document.createElement('div');
                rowEl.className = `flex items-center gap-2.5 sm:gap-3 p-2.5 rounded-xl border transition-all cursor-pointer min-w-0 ${
                    isSelected
                        ? 'bg-slate-800/80 border-blue-400/70 ring-1 ring-blue-400/30 shadow-md'
                        : 'bg-slate-950/60 border-slate-800 hover:border-slate-700 hover:bg-slate-800/40 opacity-85 hover:opacity-100'
                }`;
                rowEl.addEventListener('click', () => selectPaletteRow(rowIndex));

                // Left Row Indicator
                const badgeEl = document.createElement('div');
                badgeEl.className = `flex flex-col items-center justify-center shrink-0 w-10 py-1 rounded-lg border text-[10px] font-mono font-bold ${
                    isSelected
                        ? 'bg-blue-500/20 border-blue-400/50 text-blue-300'
                        : 'bg-slate-900 border-slate-800 text-slate-500'
                }`;
                badgeEl.innerHTML = `
                    <span>#${rowIndex + 1}</span>
                    <span class="text-[9px] font-normal mt-0.5 ${isSelected ? 'text-blue-300' : 'text-slate-600'}">${cfg.steps}</span>
                `;
                rowEl.appendChild(badgeEl);

                // Swatches Strip
                const swatchesEl = document.createElement('div');
                swatchesEl.className = 'flex-1 min-w-0 flex gap-2.5 overflow-x-auto pb-1 snap-x items-end';

                palette.forEach((p, i) => {
                    const hex = oklch_to_hex(p.l, p.c, p.h);
                    const swatch = document.createElement('div');
                    swatch.className = 'flex flex-col items-center gap-1 shrink-0 snap-center transition-transform hover:-translate-y-1';

                    let label = '';
                    if (i === 0) label = 'Start';
                    else if (i === palette.length - 1) label = 'End';
                    else if (p === cfg.mid) label = 'Middle';
                    else label = `Stop ${i + 1}`;

                    swatch.innerHTML = `
                        <div class="w-12 h-12 sm:w-16 sm:h-14 rounded-lg shadow border border-white/10" style="background-color: ${hex}"></div>
                        <span class="text-[10px] font-mono text-slate-300 uppercase">${hex}</span>
                        <span class="text-[9px] text-slate-500 font-bold tracking-wider uppercase">${label}</span>
                    `;
                    swatchesEl.appendChild(swatch);
                });
                rowEl.appendChild(swatchesEl);

                // Delete Button (present next to every row except the first one)
                if (rowIndex > 0) {
                    const delBtn = document.createElement('button');
                    delBtn.type = 'button';
                    delBtn.title = `Delete Palette #${rowIndex + 1}`;
                    delBtn.className = 'shrink-0 p-2 rounded-lg bg-slate-900/90 hover:bg-red-500/20 text-slate-400 hover:text-red-400 border border-slate-700/80 hover:border-red-500/40 transition-colors';
                    delBtn.innerHTML = `
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path>
                        </svg>
                    `;
                    delBtn.addEventListener('click', (e) => {
                        e.stopPropagation();
                        deletePaletteRow(rowIndex);
                    });
                    rowEl.appendChild(delBtn);
                }

                listContainer.appendChild(rowEl);
            });
        }


        /* --- 4. Three.js 3D Visualization --- */
        let scene, camera, renderer, controls, curveObject;

        function init3D() {
            const container = document.getElementById('3d-container');
            
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(50, container.clientWidth / container.clientHeight, 0.1, 100);
            camera.position.set(12, 12, 18);

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(container.clientWidth, container.clientHeight);
            renderer.setClearColor(0x000000, 0); // Transparent background
            container.appendChild(renderer.domElement);

            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.target.set(0, 5, 0);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;

            // Draw bounding cylinder (Visual representation of OKlch space)
            // L is Y-axis (0 to 1 -> scaled 0 to 10). Radius is C (max 0.4 -> scaled to 4)
            const cylGeo = new THREE.CylinderGeometry(4, 4, 10, 32, 1, true);
            const cylMat = new THREE.MeshBasicMaterial({ color: 0x334155, wireframe: true, transparent: true, opacity: 0.15 });
            const cylinder = new THREE.Mesh(cylGeo, cylMat);
            cylinder.position.y = 5;
            scene.add(cylinder);

            // Draw central L axis
            const axisGeo = new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(0,0,0), new THREE.Vector3(0,10,0)]);
            scene.add(new THREE.Line(axisGeo, new THREE.LineBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.2 })));
            
            // Draw Chroma limit rings
            const ringMat = new THREE.LineBasicMaterial({ color: 0x64748b, transparent: true, opacity: 0.3 });
            [0, 5, 10].forEach(y => {
                let pts = [];
                for(let i=0; i<=64; i++) {
                    let a = (i/64)*Math.PI*2;
                    pts.push(new THREE.Vector3(4*Math.cos(a), y, 4*Math.sin(a)));
                }
                scene.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts), ringMat));
            });

            // Initialize the dynamic curve
            curveObject = new THREE.Line(
                new THREE.BufferGeometry(),
                new THREE.LineBasicMaterial({ vertexColors: true, linewidth: 3 })
            );
            scene.add(curveObject);

            // Resize observer
            new ResizeObserver(() => {
                if (container.clientWidth > 0 && container.clientHeight > 0) {
                    camera.aspect = container.clientWidth / container.clientHeight;
                    camera.updateProjectionMatrix();
                    renderer.setSize(container.clientWidth, container.clientHeight);
                }
            }).observe(container);

            animate3D();
        }

        function animate3D() {
            requestAnimationFrame(animate3D);
            controls.update();
            renderer.render(scene, camera);
        }

        function update3D(palette) {
            if (!curveObject) return;

            // Render non-selected palettes as 25% opacity ghosts in 3D space
            if (!scene.ghostGroup) {
                scene.ghostGroup = new THREE.Group();
                scene.add(scene.ghostGroup);
            }
            while (scene.ghostGroup.children.length > 0) {
                let child = scene.ghostGroup.children[0];
                scene.ghostGroup.remove(child);
                if (child.geometry) child.geometry.dispose();
                if (child.material) child.material.dispose();
            }

            const ghostSphereGeo = new THREE.SphereGeometry(0.35, 16, 16);
            appState.palettes.forEach((cfg, idx) => {
                if (idx === appState.activeIndex) return;

                let gD2m = buildCurveData(t => getPointAtT1(t, cfg)).pts;
                let gM2l = buildCurveData(t => getPointAtT2(t, cfg)).pts;
                let gAllPts = [...gD2m, ...gM2l];

                let gPts = [];
                let gColors = [];
                gAllPts.forEach(p => {
                    let r = (p.c / MAX_C) * 4;
                    let a = p.h * Math.PI / 180;
                    gPts.push(new THREE.Vector3(r * Math.cos(a), p.l * 10, -r * Math.sin(a)));

                    let hex = oklch_to_hex(p.l, p.c, p.h);
                    let color = new THREE.Color(hex);
                    gColors.push(color.r, color.g, color.b);
                });

                let gCurveGeo = new THREE.BufferGeometry().setFromPoints(gPts);
                gCurveGeo.setAttribute('color', new THREE.Float32BufferAttribute(gColors, 3));
                let gCurveMat = new THREE.LineBasicMaterial({
                    vertexColors: true,
                    linewidth: 3,
                    transparent: true,
                    opacity: 0.25,
                    depthWrite: false
                });
                scene.ghostGroup.add(new THREE.Line(gCurveGeo, gCurveMat));

                let gPalette = generatePalette(cfg);
                gPalette.forEach(p => {
                    let r = (p.c / MAX_C) * 4;
                    let a = p.h * Math.PI / 180;
                    let x = r * Math.cos(a);
                    let z = -r * Math.sin(a);
                    let y = p.l * 10;

                    let hex = oklch_to_hex(p.l, p.c, p.h);
                    let mat = new THREE.MeshBasicMaterial({
                        color: hex,
                        transparent: true,
                        opacity: 0.25,
                        depthWrite: false
                    });
                    let mesh = new THREE.Mesh(ghostSphereGeo, mat);
                    mesh.position.set(x, y, z);
                    scene.ghostGroup.add(mesh);
                });
            });
            
            let pts = [];
            let colors = [];
            
            let d2m = buildCurveData(getPointAtT1).pts;
            let m2l = buildCurveData(getPointAtT2).pts;
            let allPts = [...d2m, ...m2l];

            allPts.forEach(p => {
                let r = (p.c / MAX_C) * 4;
                let a = p.h * Math.PI / 180;
                
                // Map to ThreeJS space (X=Chroma*cosH, Z=-Chroma*sinH, Y=Lightness)
                pts.push(new THREE.Vector3(r * Math.cos(a), p.l * 10, -r * Math.sin(a)));
                
                let hex = oklch_to_hex(p.l, p.c, p.h);
                let color = new THREE.Color(hex);
                colors.push(color.r, color.g, color.b);
            });

            curveObject.geometry.setFromPoints(pts);
            curveObject.geometry.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));

            // Generate Palette Spheres
            if (!scene.stopSpheres) {
                scene.stopSpheres = new THREE.Group();
                scene.add(scene.stopSpheres);
            }
            // Cleanup old spheres
            while(scene.stopSpheres.children.length > 0) { 
                let child = scene.stopSpheres.children[0];
                scene.stopSpheres.remove(child); 
                child.geometry.dispose();
                if (child.material) child.material.dispose();
            }
            
            if (palette) {
                const sphereGeo = new THREE.SphereGeometry(0.35, 16, 16);
                palette.forEach(p => {
                    let r = (p.c / MAX_C) * 4;
                    let a = p.h * Math.PI / 180;
                    let x = r * Math.cos(a);
                    let z = -r * Math.sin(a);
                    let y = p.l * 10;
                    
                    let hex = oklch_to_hex(p.l, p.c, p.h);
                    let mat = new THREE.MeshBasicMaterial({ color: hex });
                    let mesh = new THREE.Mesh(sphereGeo, mat);
                    mesh.position.set(x, y, z);
                    
                    scene.stopSpheres.add(mesh);
                });
            }
        }

        // Core Update loop (Triggers on any state change)
        function updateAll(skipInputId = null) {
            state = appState.palettes[appState.activeIndex];
            syncSidebar(skipInputId);
            updateSVGs();
            renderLCBackground(); // dynamically updates the LC background if the mid hue changed
            let generatedPalette = generatePalette(state);
            renderAllPaletteRows(generatedPalette);
            update3D(generatedPalette);
        }

        // App Initialization
        window.onload = () => {
            initSidebar();
            initHCBackground(); // Draws the static polar background once
            drawGrids();
            initInteractions();
            init3D();
            updateUndoRedoButtons();
            updateAll();
        };

    </script>
